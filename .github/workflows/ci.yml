name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    # The contract this tool consumes lives in another repository, so a weekly
    # run is what notices that the pinned Killer artifact moved while nothing
    # here changed. A green build on a stale contract is the failure mode.
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  build:
    name: build, vet and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt clean:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test -race ./...

  contract:
    name: contract binding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The vendored schema is a copy, so something has to notice when the
      # upstream contract moves. This fetches Killer's schema at the pinned
      # commit and compares hashes. It is the anti-drift property a submodule
      # would have given, without a submodule shipping an empty directory to
      # anyone who runs `go install`.
      - name: schema has not drifted from the pinned Killer release
        run: bash scripts/schema-drift-check.sh

      - name: the CLI reports its binding
        run: go run ./cmd/vibegiver contract

  round-trip:
    name: round trip against a live Killer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The committed corpus was produced by this exact binary, and a corpus
      # is a photograph: it cannot notice that the producer changed. So the
      # pinned Killer is installed and run here, and the document it writes
      # today is fed through the same loader.
      #
      # This is the job that would have caught the stale envelope version on
      # its own, with no document to compare against: the brief and the
      # roadmap both said 1.1, and a real run says 1.2.
      - name: install the pinned Vibe Killer
        run: |
          go install github.com/rohitanakiya/Vibe-Killer/cmd/vibekiller@v1.0.0
          vibekiller --version

      - name: check out Killer's fixtures
        uses: actions/checkout@v4
        with:
          repository: rohitanakiya/Vibe-Killer
          ref: v1.0.0
          path: .killer

      # Built, not `go run`. `go run` reports its own exit 1 for any non-zero
      # exit of the program it runs -- it prints "exit status 3" and exits 1 --
      # so every assertion on an exact exit code below would be checking go
      # run's code instead of Giver's. That is how the refusal assertion first
      # failed here while the refusal itself was working perfectly, and a
      # `|| [ $? -eq 1 ]` through go run would have passed on exit 3 too.
      - name: build the binary the assertions run
        run: go build -o bin/vibegiver ./cmd/vibegiver

      - name: stage the fixture
        run: |
          set -euo pipefail
          mkdir -p .work
          cp -r .killer/fixtures/flask-vulnerable .work/app
          (cd .work/app && vibekiller init)

      # Case A: the runner is bare, so no scanner is installed. This is not a
      # contrived case -- it is what the first run of this job produced, and
      # it is the most dangerous output in the whole system.
      #
      # Killer scans a deliberately vulnerable Flask application, reports "No
      # findings from the checks that ran", lists all fourteen checks as
      # skipped, and exits 0. Its success code. Every signal a pipeline
      # usually gates on says clean.
      #
      # So this asserts that Giver refuses that conclusion: exit 1, and the
      # coverage warning present in the output. Killer's own exit 0 is
      # asserted too, because if a later Killer changes it this job should say
      # so rather than quietly start testing something else.
      - name: case A, no scanners installed - zero findings is not clean
        run: |
          set -euo pipefail
          cd .work
          set +e
          vibekiller scan --repo app --static-only --runs-dir runs-bare --quiet
          scan_code=$?
          set -e
          if [ "$scan_code" -ne 0 ]; then
            echo "::notice::Killer exited $scan_code on a bare runner (was 0 when this was written)."
          fi

          run_dir="runs-bare/$(ls runs-bare | head -1)"
          found="$(python3 -c "import json,sys;print(len(json.load(open(sys.argv[1]))['findings']))" "$run_dir/findings.json")"
          skipped="$(python3 -c "import json,sys;print(len(json.load(open(sys.argv[1])).get('skipped',[])))" "$run_dir/findings.json")"
          echo "bare runner: $found finding(s), $skipped skipped check(s)"
          if [ "$found" -ne 0 ] || [ "$skipped" -eq 0 ]; then
            echo "::error::Expected the bare-runner shape: 0 findings and a populated skipped[]. This step is no longer testing what it was written for." >&2
            exit 1
          fi

          cd ..
          set +e
          out="$(./bin/vibegiver inspect ".work/$run_dir" 2>&1)"
          code=$?
          set -e
          echo "$out"
          if [ "$code" -ne 1 ]; then
            echo "::error::inspect exited $code on a run that found nothing because nothing ran. Want 1: that run established nothing and is not a clean result." >&2
            exit 1
          fi
          if ! grep -q "did not establish" <<<"$out"; then
            echo "::error::inspect did not say that the run established nothing." >&2
            exit 1
          fi

      # Semgrep, not osv-scanner, and the reason is worth recording.
      #
      # This step first used osv-scanner, because it is a Go install and takes
      # seconds where Semgrep's does not. It found 42 findings on the first
      # run and 0 on the second, from the same fixture and the same commit:
      # it consults a remote advisory service, so it is network-dependent, and
      # Killer correctly recorded it as having run both times. Nothing in that
      # output distinguishes "ran and the dependencies are fine" from "ran and
      # learned nothing", which is this project's own bug shape arriving from
      # the outside.
      #
      # Semgrep ships its rule pack embedded in the Killer binary and needs no
      # network, so it gives the same answer every time. It is also the engine
      # the v0 strategies actually depend on: both misconfiguration findings
      # they fix are sast.
      # Pinned to the version Killer v1.0.0 pins in its own CI, and pinned for
      # a stronger reason here than there.
      #
      # Killer pins it because the silent half of its rule-pack assertion is
      # sensitive to the engine, so a floating version turns an upstream change
      # into a red build on a commit that touched nothing. Giver inherits that
      # and makes it worse: it proves a static fix by reading that silence, so
      # a pack gone quiet does not fail here, it succeeds. Measured on this
      # workflow before the pin: a pipx-installed latest Semgrep reported
      # engine.semgrep as having run and produced 0 findings on
      # flask-vulnerable, where 1.185.0 produces 11. Followed through the loop
      # that is already_resolved -- nothing to fix -- for a deliberately
      # vulnerable application.
      #
      # `vibegiver fix` now refuses to read a static absence as a fix when the
      # installed Semgrep is not the pinned one, so a future drift is a
      # blocked_unverifiable rather than a false clean. The pin keeps this job
      # testing the fixes rather than testing that guard.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install semgrep
        run: |
          pip install --disable-pip-version-check semgrep==1.185.0
          # Verified rather than assumed: a silent install failure would make
          # the next steps scan with no static engine, find nothing to fix,
          # and look like a pass.
          semgrep --version

      - name: case B, a scanner present - findings appear and are attemptable
        run: |
          set -euo pipefail
          cd .work
          set +e
          vibekiller scan --repo app --static-only --runs-dir runs --quiet
          scan_code=$?
          set -e
          if [ "$scan_code" -ne 1 ]; then
            echo "::error::Killer exited $scan_code scanning a vulnerable fixture with a scanner installed, want 1 (findings at or above the threshold)." >&2
            exit 1
          fi

          run_dir="runs/$(ls runs | head -1)"
          found="$(python3 -c "import json,sys;print(len(json.load(open(sys.argv[1]))['findings']))" "$run_dir/findings.json")"
          echo "with semgrep: $found finding(s)"
          if [ "$found" -eq 0 ]; then
            echo "::error::No findings with a scanner installed; this step asserts nothing." >&2
            exit 1
          fi

          cd ..
          # Exactly 1. Exit 3 would mean the contract was refused, which is
          # the failure this job exists to catch, and a loose check reads it
          # as success.
          set +e
          ./bin/vibegiver inspect ".work/$run_dir"
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "::error::inspect exited $code on a run with open findings, want 1." >&2
            exit 1
          fi

      - name: the envelope a live Killer writes is the one this build expects
        run: |
          set -euo pipefail
          run_dir=".work/runs/$(ls .work/runs | head -1)"
          live="$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['schema_version'])" "$run_dir/findings.json")"
          expected="$(./bin/vibegiver contract | awk '/^Envelope schema_version/ {print $3}')"
          echo "live Killer wrote: $live"
          echo "this build expects: $expected"
          if [ "$live" != "$expected" ]; then
            echo "::error::The envelope moved. A live Killer writes $live and this build is written against $expected." >&2
            exit 1
          fi

      # The v0 loop, end to end, against the fixture Killer ships. This is the
      # round trip the brief calls the demo and the test: Killer finds it,
      # Giver fixes it, and a Killer scan that Giver did not run confirms it.
      #
      # It needs the Semgrep installed above: both misconfiguration findings
      # v0 fixes are sast, so without that engine there is nothing to fix and
      # this step would assert nothing. It checks they are there before
      # trying.
      - name: case C, the v0 loop fixes the misconfiguration findings
        run: |
          set -euo pipefail

          # A fixture repository with an owner who is not Vibe Giver, so the
          # commit identity and the clean-tree rule are exercised for real.
          rm -rf .work/fixrepo
          mkdir -p .work/fixrepo
          cp .killer/fixtures/flask-vulnerable/app.py .killer/fixtures/flask-vulnerable/requirements.txt .work/fixrepo/
          cd .work/fixrepo
          git init -q
          git config user.name "Fixture Owner"
          git config user.email owner@example.invalid
          git add -A
          git commit -qm "the flask-vulnerable fixture"
          head_before="$(git rev-parse HEAD)"
          cd ../..

          vibekiller scan --repo .work/fixrepo --static-only --runs-dir .work/fixruns --quiet || [ $? -eq 1 ]
          run_dir=".work/fixruns/$(ls .work/fixruns | head -1)"

          misconfig="$(python3 -c "
          import json,sys
          d=json.load(open(sys.argv[1]))
          print(len([f for f in d['findings'] if f['category']=='security-misconfiguration']))
          " "$run_dir/findings.json")"
          echo "misconfiguration findings to fix: $misconfig"
          if [ "$misconfig" -lt 2 ]; then
            echo "::error::Expected at least 2 security-misconfiguration findings; this step would assert nothing." >&2
            exit 1
          fi

          # Exit 1 is expected: the source scan skipped checks, so nothing here
          # is a clean bill of health even once the fixes land.
          set +e
          ./bin/vibegiver fix "$run_dir" --repo .work/fixrepo --runs-dir .work/giverruns
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "::error::vibegiver fix exited $code, want 1." >&2
            exit 1
          fi

          fixed="$(python3 -c "
          import json,sys
          d=json.load(open(sys.argv[1]))
          print(len([o for o in d['outcomes'] if o['status']=='fixed']))
          " .work/giverruns/fix_report.json)"
          echo "fixed: $fixed"
          if [ "$fixed" -lt 2 ]; then
            echo "::error::Giver proved $fixed fixes, want at least 2." >&2
            exit 1
          fi

          # The operator checkout must be untouched: same HEAD, clean tree.
          cd .work/fixrepo
          if [ "$(git rev-parse HEAD)" != "$head_before" ]; then
            echo "::error::Giver moved the operator HEAD." >&2
            exit 1
          fi
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Giver left the operator working tree dirty." >&2
            exit 1
          fi
          if [ "$(git worktree list | wc -l)" -ne 1 ]; then
            echo "::error::Giver left a worktree behind." >&2
            git worktree list >&2
            exit 1
          fi
          # No tool trailers in anything Giver wrote into someone else's repo.
          if git log --all --format='%B' | grep -qiE "co-authored-by|generated with \[claude"; then
            echo "::error::Giver wrote an attribution trailer into a commit message." >&2
            exit 1
          fi
          git branch --list 'vibegiver/*'
          cd ../..

      # The independent confirmation. Giver verified these fixes with its own
      # focused re-scans; this scans each branch separately and asks Killer
      # again, because a tool checking its own work is the thing this project
      # does not accept as evidence.
      - name: case C, a separate Killer scan confirms each fix
        run: |
          set -euo pipefail
          root="$PWD"
          branches="$(git -C .work/fixrepo branch --list 'vibegiver/*' --format='%(refname:short)')"
          for branch in $branches; do
            id="${branch##*/}"
            git -C .work/fixrepo worktree add -q "$root/.work/verify-$id" "$branch"
            vibekiller scan --repo "$root/.work/verify-$id" --static-only \
              --runs-dir "$root/.work/verifyruns/$id" --quiet || [ $? -eq 1 ]
            vrun="$root/.work/verifyruns/$id/$(ls "$root/.work/verifyruns/$id" | head -1)"
            python3 - "$vrun/findings.json" "$id" <<'PY'
          import json, sys
          doc = json.load(open(sys.argv[1]))
          want = sys.argv[2]
          ids = {f["finding_id"] for f in doc["findings"]}
          skipped = {s["check_id"] for s in doc.get("skipped", [])}
          if "engine.semgrep" in skipped:
              print(f"::error::engine.semgrep did not run, so the absence of {want} establishes nothing")
              sys.exit(1)
          if want in ids:
              print(f"::error::{want} is still reported after the fix Giver called proven")
              sys.exit(1)
          print(f"{want}: absent, and engine.semgrep ran -- independently confirmed")
          PY
          done

      - name: a newer envelope is refused, not read
        run: |
          set -euo pipefail
          run_dir=".work/runs/$(ls .work/runs | head -1)"
          mkdir -p .work/forged
          python3 - "$run_dir/findings.json" .work/forged/findings.json <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          d["schema_version"] = "99.0"
          json.dump(d, open(sys.argv[2], "w"), indent=2)
          PY
          # A guard that cannot fail is not a guard, so the refusal is
          # exercised rather than assumed. Exit 3 is ExitRefused, and it has
          # to be exactly 3: exit 1 would mean the document was read and
          # merely had open findings in it.
          set +e
          ./bin/vibegiver inspect .work/forged/findings.json
          code=$?
          set -e
          if [ "$code" -ne 3 ]; then
            echo "::error::An envelope from the future exited $code, want 3 (refused)." >&2
            exit 1
          fi
          echo "refused with exit 3, as intended"
