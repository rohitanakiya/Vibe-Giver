name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    # The contract this tool consumes lives in another repository, so a weekly
    # run is what notices that the pinned Killer artifact moved while nothing
    # here changed. A green build on a stale contract is the failure mode.
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  build:
    name: build, vet and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt clean:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test -race ./...

  contract:
    name: contract binding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The vendored schema is a copy, so something has to notice when the
      # upstream contract moves. This fetches Killer's schema at the pinned
      # commit and compares hashes. It is the anti-drift property a submodule
      # would have given, without a submodule shipping an empty directory to
      # anyone who runs `go install`.
      - name: schema has not drifted from the pinned Killer release
        run: bash scripts/schema-drift-check.sh

      - name: the CLI reports its binding
        run: go run ./cmd/vibegiver contract

  round-trip:
    name: round trip against a live Killer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The committed corpus was produced by this exact binary, and a corpus
      # is a photograph: it cannot notice that the producer changed. So the
      # pinned Killer is installed and run here, and the document it writes
      # today is fed through the same loader.
      #
      # This is the job that would have caught the stale envelope version on
      # its own, with no document to compare against: the brief and the
      # roadmap both said 1.1, and a real run says 1.2.
      - name: install the pinned Vibe Killer
        run: |
          go install github.com/rohitanakiya/Vibe-Killer/cmd/vibekiller@v1.0.0
          vibekiller --version

      - name: check out Killer's fixtures
        uses: actions/checkout@v4
        with:
          repository: rohitanakiya/Vibe-Killer
          ref: v1.0.0
          path: .killer

      # Built, not `go run`. `go run` reports its own exit 1 for any non-zero
      # exit of the program it runs -- it prints "exit status 3" and exits 1 --
      # so every assertion on an exact exit code below would be checking go
      # run's code instead of Giver's. That is how the refusal assertion first
      # failed here while the refusal itself was working perfectly, and a
      # `|| [ $? -eq 1 ]` through go run would have passed on exit 3 too.
      - name: build the binary the assertions run
        run: go build -o bin/vibegiver ./cmd/vibegiver

      - name: stage the fixture
        run: |
          set -euo pipefail
          mkdir -p .work
          cp -r .killer/fixtures/flask-vulnerable .work/app
          (cd .work/app && vibekiller init)

      # Case A: the runner is bare, so no scanner is installed. This is not a
      # contrived case -- it is what the first run of this job produced, and
      # it is the most dangerous output in the whole system.
      #
      # Killer scans a deliberately vulnerable Flask application, reports "No
      # findings from the checks that ran", lists all fourteen checks as
      # skipped, and exits 0. Its success code. Every signal a pipeline
      # usually gates on says clean.
      #
      # So this asserts that Giver refuses that conclusion: exit 1, and the
      # coverage warning present in the output. Killer's own exit 0 is
      # asserted too, because if a later Killer changes it this job should say
      # so rather than quietly start testing something else.
      - name: case A, no scanners installed - zero findings is not clean
        run: |
          set -euo pipefail
          cd .work
          set +e
          vibekiller scan --repo app --static-only --runs-dir runs-bare --quiet
          scan_code=$?
          set -e
          if [ "$scan_code" -ne 0 ]; then
            echo "::notice::Killer exited $scan_code on a bare runner (was 0 when this was written)."
          fi

          run_dir="runs-bare/$(ls runs-bare | head -1)"
          found="$(python3 -c "import json,sys;print(len(json.load(open(sys.argv[1]))['findings']))" "$run_dir/findings.json")"
          skipped="$(python3 -c "import json,sys;print(len(json.load(open(sys.argv[1])).get('skipped',[])))" "$run_dir/findings.json")"
          echo "bare runner: $found finding(s), $skipped skipped check(s)"
          if [ "$found" -ne 0 ] || [ "$skipped" -eq 0 ]; then
            echo "::error::Expected the bare-runner shape: 0 findings and a populated skipped[]. This step is no longer testing what it was written for." >&2
            exit 1
          fi

          cd ..
          set +e
          out="$(./bin/vibegiver inspect ".work/$run_dir" 2>&1)"
          code=$?
          set -e
          echo "$out"
          if [ "$code" -ne 1 ]; then
            echo "::error::inspect exited $code on a run that found nothing because nothing ran. Want 1: that run established nothing and is not a clean result." >&2
            exit 1
          fi
          if ! grep -q "did not establish" <<<"$out"; then
            echo "::error::inspect did not say that the run established nothing." >&2
            exit 1
          fi

      # Case B: with a scanner present, the same fixture yields real findings.
      # osv-scanner is used rather than Semgrep because it is a Go install and
      # takes seconds; the fixture pins old dependencies deliberately, so it
      # is the layer guaranteed to produce findings here.
      - name: install osv-scanner
        run: go install github.com/google/osv-scanner/v2/cmd/osv-scanner@latest

      - name: case B, a scanner present - findings appear and are attemptable
        run: |
          set -euo pipefail
          cd .work
          set +e
          vibekiller scan --repo app --static-only --runs-dir runs --quiet
          scan_code=$?
          set -e
          if [ "$scan_code" -ne 1 ]; then
            echo "::error::Killer exited $scan_code scanning a vulnerable fixture with a scanner installed, want 1 (findings at or above the threshold)." >&2
            exit 1
          fi

          run_dir="runs/$(ls runs | head -1)"
          found="$(python3 -c "import json,sys;print(len(json.load(open(sys.argv[1]))['findings']))" "$run_dir/findings.json")"
          echo "with osv-scanner: $found finding(s)"
          if [ "$found" -eq 0 ]; then
            echo "::error::No findings with a scanner installed; this step asserts nothing." >&2
            exit 1
          fi

          cd ..
          # Exactly 1. Exit 3 would mean the contract was refused, which is
          # the failure this job exists to catch, and a loose check reads it
          # as success.
          set +e
          ./bin/vibegiver inspect ".work/$run_dir"
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "::error::inspect exited $code on a run with open findings, want 1." >&2
            exit 1
          fi

      - name: the envelope a live Killer writes is the one this build expects
        run: |
          set -euo pipefail
          run_dir=".work/runs/$(ls .work/runs | head -1)"
          live="$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['schema_version'])" "$run_dir/findings.json")"
          expected="$(./bin/vibegiver contract | awk '/^Envelope schema_version/ {print $3}')"
          echo "live Killer wrote: $live"
          echo "this build expects: $expected"
          if [ "$live" != "$expected" ]; then
            echo "::error::The envelope moved. A live Killer writes $live and this build is written against $expected." >&2
            exit 1
          fi

      - name: a newer envelope is refused, not read
        run: |
          set -euo pipefail
          run_dir=".work/runs/$(ls .work/runs | head -1)"
          mkdir -p .work/forged
          python3 - "$run_dir/findings.json" .work/forged/findings.json <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          d["schema_version"] = "99.0"
          json.dump(d, open(sys.argv[2], "w"), indent=2)
          PY
          # A guard that cannot fail is not a guard, so the refusal is
          # exercised rather than assumed. Exit 3 is ExitRefused, and it has
          # to be exactly 3: exit 1 would mean the document was read and
          # merely had open findings in it.
          set +e
          ./bin/vibegiver inspect .work/forged/findings.json
          code=$?
          set -e
          if [ "$code" -ne 3 ]; then
            echo "::error::An envelope from the future exited $code, want 3 (refused)." >&2
            exit 1
          fi
          echo "refused with exit 3, as intended"
