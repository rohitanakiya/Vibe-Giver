name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    # The contract this tool consumes lives in another repository, so a weekly
    # run is what notices that the pinned Killer artifact moved while nothing
    # here changed. A green build on a stale contract is the failure mode.
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  build:
    name: build, vet and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt clean:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test -race ./...

  contract:
    name: contract binding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The vendored schema is a copy, so something has to notice when the
      # upstream contract moves. This fetches Killer's schema at the pinned
      # commit and compares hashes. It is the anti-drift property a submodule
      # would have given, without a submodule shipping an empty directory to
      # anyone who runs `go install`.
      - name: schema has not drifted from the pinned Killer release
        run: bash scripts/schema-drift-check.sh

      - name: the CLI reports its binding
        run: go run ./cmd/vibegiver contract

  round-trip:
    name: round trip against a live Killer
    runs-on: ubuntu-latest

    # Everything this job stages lives OUTSIDE the workspace, deliberately,
    # and finding out why cost three red builds.
    #
    # Semgrep and osv-scanner both skip paths that their enclosing git
    # repository ignores. This job used to stage the fixture under .work/,
    # which this repository gitignores, so both engines scanned zero files,
    # exited 0, and reported no findings -- which Killer correctly recorded as
    # "the check ran". A deliberately vulnerable application came back clean.
    #
    # Measured directly rather than inferred: semgrep reports
    # "paths scanned: 0" with no errors on a gitignored directory, and 3
    # findings on the same file outside one. osv-scanner reports "0 Extract
    # calls / No package sources found" on the same directory.
    #
    # It is the third time in this project that an engine which ran, exited 0
    # and learned nothing has been indistinguishable from a clean result.
    # WORK is derived per step from $RUNNER_TEMP rather than set in a job-level
    # env block: the `runner` context is not available there, and GitHub
    # rejects the entire workflow file if it is used.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Pinned to the Semgrep that Killer v1.0.0 pins in its own CI. Killer
      # pins it because the silent half of its rule-pack assertion is
      # sensitive to the engine and not only to the rules, so a floating
      # version turns an upstream change into a red build on a commit that
      # touched nothing. Giver reads that silence as proof a fix landed, so
      # the same drift here is a false clean rather than a red build --
      # `vibegiver fix` refuses a static absence on a mismatched engine for
      # that reason, and this pin keeps the job testing the fixes rather than
      # testing the guard.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install the pinned Vibe Killer and Semgrep
        run: |
          go install github.com/rohitanakiya/Vibe-Killer/cmd/vibekiller@v1.0.0
          pip install --disable-pip-version-check semgrep==1.185.0
          # Verified rather than assumed: a silent install failure would make
          # every scan below find nothing and look like a pass.
          vibekiller --version
          semgrep --version

      - name: check out Killer's fixtures
        uses: actions/checkout@v4
        with:
          repository: rohitanakiya/Vibe-Killer
          ref: v1.0.0
          path: .killer

      # Built, not `go run`. `go run` reports its own exit 1 for any non-zero
      # exit of the program it runs -- it prints "exit status 3" and exits 1 --
      # so every assertion on an exact exit code below would be checking go
      # run's code instead of Giver's.
      - name: build the binary the assertions run
        run: go build -o bin/vibegiver ./cmd/vibegiver

      - name: stage the fixture outside the workspace
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/work"
          rm -rf "$WORK"
          mkdir -p "$WORK"
          cp -r .killer/fixtures/flask-vulnerable "$WORK/app"
          (cd "$WORK/app" && vibekiller init)
          # The staging directory must not be inside a git repository that
          # ignores it, which is the whole point of using runner.temp.
          if git -C "$WORK" rev-parse --show-toplevel 2>/dev/null; then
            echo "::error::$WORK is inside a git repository; the engines may skip it." >&2
            exit 1
          fi
          echo "staged at $WORK/app, outside any git repository"

      # Case A: no scanners visible to Killer. This is not contrived -- it is
      # what a bare runner produces, and it is the most dangerous output in
      # the system: Killer scans a deliberately vulnerable application,
      # reports "No findings from the checks that ran", lists every check as
      # skipped, and exits 0. Its success code.
      #
      # Semgrep is installed by now, so it is hidden rather than uninstalled:
      # PATH without the Python bin directory is the honest way to produce the
      # bare-runner shape without reordering the job around it.
      - name: case A, no scanners visible - zero findings is not clean
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/work"
          cd "$WORK"
          export PATH="/usr/local/bin:/usr/bin:/bin:$(go env GOPATH)/bin"
          if command -v semgrep >/dev/null; then
            echo "::error::semgrep is still on PATH; this step would not be testing the bare-runner shape." >&2
            exit 1
          fi

          set +e
          vibekiller scan --repo app --static-only --runs-dir runs-bare --quiet
          scan_code=$?
          set -e
          if [ "$scan_code" -ne 0 ]; then
            echo "::notice::Killer exited $scan_code with no scanners (was 0 when this was written)."
          fi

          run_dir="runs-bare/$(ls runs-bare | head -1)"
          found="$(python3 -c "import json,sys;print(len(json.load(open(sys.argv[1]))['findings']))" "$run_dir/findings.json")"
          skipped="$(python3 -c "import json,sys;print(len(json.load(open(sys.argv[1])).get('skipped',[])))" "$run_dir/findings.json")"
          echo "bare runner: $found finding(s), $skipped skipped check(s)"
          if [ "$found" -ne 0 ] || [ "$skipped" -eq 0 ]; then
            echo "::error::Expected the bare-runner shape: 0 findings and a populated skipped[]. This step is no longer testing what it was written for." >&2
            exit 1
          fi

          cd "$GITHUB_WORKSPACE"
          set +e
          out="$(./bin/vibegiver inspect "$WORK/$run_dir" 2>&1)"
          code=$?
          set -e
          echo "$out"
          if [ "$code" -ne 1 ]; then
            echo "::error::inspect exited $code on a run that found nothing because nothing ran. Want 1: that run established nothing and is not a clean result." >&2
            exit 1
          fi
          if ! grep -q "did not establish" <<<"$out"; then
            echo "::error::inspect did not say that the run established nothing." >&2
            exit 1
          fi

      # Case B: with the static engine present, the same fixture yields real
      # findings. Both misconfiguration findings v0 fixes are sast, so this is
      # the engine the next step depends on.
      - name: case B, the static engine present - findings appear
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/work"
          cd "$WORK"
          set +e
          vibekiller scan --repo app --static-only --runs-dir runs --quiet
          scan_code=$?
          set -e
          if [ "$scan_code" -ne 1 ]; then
            echo "::error::Killer exited $scan_code scanning a vulnerable fixture with Semgrep installed, want 1 (findings at or above the threshold)." >&2
            exit 1
          fi

          run_dir="runs/$(ls runs | head -1)"
          found="$(python3 -c "import json,sys;print(len(json.load(open(sys.argv[1]))['findings']))" "$run_dir/findings.json")"
          echo "with semgrep: $found finding(s)"
          if [ "$found" -eq 0 ]; then
            echo "::error::No findings with Semgrep installed; this step asserts nothing." >&2
            exit 1
          fi

          cd "$GITHUB_WORKSPACE"
          # Exactly 1. Exit 3 would mean the contract was refused, which is
          # the failure this job exists to catch, and a loose check reads it
          # as success.
          set +e
          ./bin/vibegiver inspect "$WORK/$run_dir"
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "::error::inspect exited $code on a run with open findings, want 1." >&2
            exit 1
          fi

      - name: the envelope a live Killer writes is the one this build expects
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/work"
          run_dir="$WORK/runs/$(ls "$WORK/runs" | head -1)"
          live="$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['schema_version'])" "$run_dir/findings.json")"
          expected="$(./bin/vibegiver contract | awk '/^Envelope schema_version/ {print $3}')"
          echo "live Killer wrote: $live"
          echo "this build expects: $expected"
          if [ "$live" != "$expected" ]; then
            echo "::error::The envelope moved. A live Killer writes $live and this build is written against $expected." >&2
            exit 1
          fi

      # The v0 loop, end to end. This is the round trip the brief calls the
      # demo and the test: Killer finds it, Giver fixes it, and a Killer scan
      # that Giver did not run confirms it.
      - name: case C, the v0 loop fixes the misconfiguration findings
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/work"

          # A fixture repository owned by somebody who is not Vibe Giver, so
          # the commit identity and the clean-tree rule are exercised for real.
          rm -rf "$WORK/fixrepo"
          mkdir -p "$WORK/fixrepo"
          cp .killer/fixtures/flask-vulnerable/app.py \
             .killer/fixtures/flask-vulnerable/requirements.txt "$WORK/fixrepo/"
          git -C "$WORK/fixrepo" init -q
          git -C "$WORK/fixrepo" config user.name "Fixture Owner"
          git -C "$WORK/fixrepo" config user.email owner@example.invalid
          git -C "$WORK/fixrepo" add -A
          git -C "$WORK/fixrepo" commit -qm "the flask-vulnerable fixture"
          head_before="$(git -C "$WORK/fixrepo" rev-parse HEAD)"

          vibekiller scan --repo "$WORK/fixrepo" --static-only \
            --runs-dir "$WORK/fixruns" --quiet || [ $? -eq 1 ]
          run_dir="$WORK/fixruns/$(ls "$WORK/fixruns" | head -1)"

          misconfig="$(python3 -c "
          import json,sys
          d=json.load(open(sys.argv[1]))
          print(len([f for f in d['findings'] if f['category']=='security-misconfiguration']))
          " "$run_dir/findings.json")"
          echo "misconfiguration findings to fix: $misconfig"
          if [ "$misconfig" -lt 2 ]; then
            echo "::error::Expected at least 2 security-misconfiguration findings; this step would assert nothing." >&2
            exit 1
          fi

          # Exit 1 is expected: the source scan skipped checks, so nothing
          # here is a clean bill of health even once the fixes land.
          set +e
          ./bin/vibegiver fix "$run_dir" --repo "$WORK/fixrepo" --runs-dir "$WORK/giverruns"
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "::error::vibegiver fix exited $code, want 1." >&2
            exit 1
          fi

          fixed="$(python3 -c "
          import json,sys
          d=json.load(open(sys.argv[1]))
          print(len([o for o in d['outcomes'] if o['status']=='fixed']))
          " "$WORK/giverruns/fix_report.json")"
          echo "fixed: $fixed"
          if [ "$fixed" -lt 2 ]; then
            echo "::error::Giver proved $fixed fixes, want at least 2." >&2
            exit 1
          fi

          # The operator checkout must be untouched: same HEAD, clean tree, no
          # stray worktree.
          if [ "$(git -C "$WORK/fixrepo" rev-parse HEAD)" != "$head_before" ]; then
            echo "::error::Giver moved the operator HEAD." >&2
            exit 1
          fi
          if [ -n "$(git -C "$WORK/fixrepo" status --porcelain)" ]; then
            echo "::error::Giver left the operator working tree dirty." >&2
            exit 1
          fi
          if [ "$(git -C "$WORK/fixrepo" worktree list | wc -l)" -ne 1 ]; then
            echo "::error::Giver left a worktree behind." >&2
            git -C "$WORK/fixrepo" worktree list >&2
            exit 1
          fi
          # No tool trailers in anything Giver wrote into someone else's repo.
          if git -C "$WORK/fixrepo" log --all --format='%B' | grep -qiE "co-authored-by|generated with \[claude"; then
            echo "::error::Giver wrote an attribution trailer into a commit message." >&2
            exit 1
          fi
          git -C "$WORK/fixrepo" branch --list 'vibegiver/*'

      # The independent confirmation. Giver verified these fixes with its own
      # focused re-scans; this scans each branch separately and asks Killer
      # again, because a tool checking its own work is not evidence.
      - name: case C, a separate Killer scan confirms each fix
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/work"
          branches="$(git -C "$WORK/fixrepo" branch --list 'vibegiver/*' --format='%(refname:short)')"
          if [ -z "$branches" ]; then
            echo "::error::no vibegiver branches to verify." >&2
            exit 1
          fi
          for branch in $branches; do
            id="${branch##*/}"
            git -C "$WORK/fixrepo" worktree add -q "$WORK/verify-$id" "$branch"
            vibekiller scan --repo "$WORK/verify-$id" --static-only \
              --runs-dir "$WORK/verifyruns/$id" --quiet || [ $? -eq 1 ]
            vrun="$WORK/verifyruns/$id/$(ls "$WORK/verifyruns/$id" | head -1)"
            python3 - "$vrun/findings.json" "$id" <<'PY'
          import json, sys
          doc = json.load(open(sys.argv[1]))
          want = sys.argv[2]
          ids = {f["finding_id"] for f in doc["findings"]}
          skipped = {s["check_id"] for s in doc.get("skipped", [])}
          if "engine.semgrep" in skipped:
              print(f"::error::engine.semgrep did not run, so the absence of {want} establishes nothing")
              sys.exit(1)
          if not ids:
              print("::error::the verification scan found nothing at all, which usually means it scanned nothing")
              sys.exit(1)
          if want in ids:
              print(f"::error::{want} is still reported after the fix Giver called proven")
              sys.exit(1)
          print(f"{want}: absent, engine.semgrep ran, {len(ids)} other findings still reported -- confirmed")
          PY
          done

      - name: a newer envelope is refused, not read
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/work"
          run_dir="$WORK/runs/$(ls "$WORK/runs" | head -1)"
          mkdir -p "$WORK/forged"
          python3 - "$run_dir/findings.json" "$WORK/forged/findings.json" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          d["schema_version"] = "99.0"
          json.dump(d, open(sys.argv[2], "w"), indent=2)
          PY
          # A guard that cannot fail is not a guard, so the refusal is
          # exercised rather than assumed. Exit 3 is ExitRefused, and it has
          # to be exactly 3: exit 1 would mean the document was read and
          # merely had open findings in it.
          set +e
          ./bin/vibegiver inspect "$WORK/forged/findings.json"
          code=$?
          set -e
          if [ "$code" -ne 3 ]; then
            echo "::error::An envelope from the future exited $code, want 3 (refused)." >&2
            exit 1
          fi
          echo "refused with exit 3, as intended"
